name: Benny

# Triages WhatsApp reports that the bridge files as issues, and drafts a fix for a bug.
# The bridge mirrors the benny:* labels back to WhatsApp, so every path ends on a label.
# Label changes made here with GITHUB_TOKEN start no workflow, so both stages live in this file.

on:
  issues:
    types: [opened, labeled]

permissions: {}

jobs:
  triage:
    # The repository is public. Only the owner's account files reports and asks for a re-triage.
    if: >-
      github.event.issue.user.login == 'chrislazar25' &&
      github.event.sender.login == 'chrislazar25' &&
      contains(github.event.issue.labels.*.name, 'benny:report') &&
      (github.event.action == 'opened' || github.event.label.name == 'benny:triage-again')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      duplicate_of: ${{ steps.verdict.outputs.duplicate_of }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark the report as in triage
        run: |
          for label in benny:triage benny:bug benny:other benny:no-repro benny:fixing benny:pr benny:blocked benny:triage-again; do
            gh label create "$label" --color 5319E7 --description 'Benny WhatsApp report state' 2>/dev/null || true
          done
          gh issue edit "$ISSUE" \
            --remove-label benny:triage-again,benny:bug,benny:other,benny:no-repro,benny:fixing,benny:blocked \
            --add-label benny:triage
      - name: Collect the report
        run: .github/benny/context.sh "$ISSUE" "$RUNNER_TEMP/benny"
      - name: Triage
        id: claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow .github/benny/triage.md for issue #${{ github.event.issue.number }}.
            The report and its context are in ${{ runner.temp }}/benny/report.md.
          claude_args: |
            --model sonnet
            --permission-mode default
            --add-dir ${{ runner.temp }}/benny
            --allowedTools "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status)" "Bash(ls:*)" "Bash(node --test tests/content.test.js)" "WebFetch(domain:cpbjr.github.io)" "WebFetch(domain:bible.usccb.org)"
            --disallowedTools Edit Write NotebookEdit WebSearch "Bash(gh:*)" "Bash(curl:*)" "Bash(git push:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","summary","duplicate_of","evidence"],"properties":{"verdict":{"type":"string","enum":["bug","other","no-repro"]},"summary":{"type":"string"},"duplicate_of":{"type":"integer"},"evidence":{"type":"string"}}}'
      - name: Read the verdict
        id: verdict
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          dir="$RUNNER_TEMP/benny"
          printf '%s' "$OUTPUT" > "$dir/verdict.json"
          jq -e '(.verdict | IN("bug", "other", "no-repro")) and (.summary | type == "string" and length > 0)
            and (.duplicate_of | type == "number" and . >= 0 and . == floor) and (.evidence | type == "string")' \
            "$dir/verdict.json" > /dev/null
          duplicate_of=$(jq -r '.duplicate_of' "$dir/verdict.json")
          if [[ "$duplicate_of" != 0 ]] && ! grep -qx "$duplicate_of" "$dir/open-reports.txt"; then
            echo "::warning::#$duplicate_of is not another open report, so this report is not treated as a duplicate."
            duplicate_of=0
          fi
          echo "verdict=$(jq -r '.verdict' "$dir/verdict.json")" >> "$GITHUB_OUTPUT"
          echo "duplicate_of=$duplicate_of" >> "$GITHUB_OUTPUT"
      - name: Post the verdict
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          jq -r '"<!-- benny:triage -->", "**Triage: \(.verdict)**", "", .summary, "",
            "<details><summary>What Benny checked</summary>", "", .evidence, "", "</details>"
            | gsub("@"; "@​")' "$RUNNER_TEMP/benny/verdict.json" | gh issue comment "$ISSUE" --body-file -
          gh issue edit "$ISSUE" --remove-label benny:triage --add-label "benny:$VERDICT"
      - name: Mark the report as blocked
        if: failure() || cancelled()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --remove-label benny:triage --add-label benny:blocked
          printf '<!-- benny:blocked -->\nBenny could not finish triaging this report, so it needs a person. See the [workflow run](%s).\n' "$RUN_URL" |
            gh issue comment "$ISSUE" --body-file -

  fix:
    needs: triage
    if: needs.triage.outputs.verdict == 'bug' && needs.triage.outputs.duplicate_of == '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: benny/issue-${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local-lab/package-lock.json
      - name: Start the fix
        id: start
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [[ -n "$existing" ]]; then
            printf '<!-- benny:pr -->\nA draft fix for this report is already open, so Benny did not start another: %s\n' "$existing" |
              gh issue comment "$ISSUE" --body-file -
            gh issue edit "$ISSUE" --add-label benny:pr
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label benny:fixing
          git switch -c "$BRANCH"
          .github/benny/context.sh "$ISSUE" "$RUNNER_TEMP/benny"
          npm ci --prefix local-lab
      - name: Fix
        id: claude
        if: steps.start.outputs.existing != 'true'
        timeout-minutes: 75
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow .github/benny/fix.md for issue #${{ github.event.issue.number }}.
            The report, its follow-ups and the triage note are in ${{ runner.temp }}/benny/report.md.
          claude_args: |
            --model opus
            --permission-mode acceptEdits
            --add-dir ${{ runner.temp }}/benny
            --allowedTools "Bash(git log:*)" "Bash(git show:*)" "Bash(git diff:*)" "Bash(git status)" "Bash(ls:*)" "Bash(node --test:*)" "Bash(npm run check --prefix local-lab)" "Bash(node local-lab/verify.mjs all)" "Bash(node local-lab/verify-runtime.mjs)" "Bash(node local-lab/verify-image.mjs)" "Bash(npm ci --prefix whatsapp-bridge)" "Bash(npm run check --prefix whatsapp-bridge)" "Bash(npm test --prefix whatsapp-bridge)" "WebFetch(domain:cpbjr.github.io)" "WebFetch(domain:bible.usccb.org)"
            --disallowedTools WebSearch "Bash(gh:*)" "Bash(curl:*)" "Bash(git push:*)" "Bash(git commit:*)" "Bash(git add:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["outcome","reason","commit_message","pr_title","pr_body"],"properties":{"outcome":{"type":"string","enum":["pr","blocked"]},"reason":{"type":"string"},"commit_message":{"type":"string"},"pr_title":{"type":"string"},"pr_body":{"type":"string"}}}'
      - name: Read the outcome
        id: outcome
        if: steps.start.outputs.existing != 'true'
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          printf '%s' "$OUTPUT" > "$RUNNER_TEMP/benny/outcome.json"
          jq -e '(.outcome | IN("pr", "blocked")) and (.reason | type == "string" and length > 0)
            and ([.commit_message, .pr_title, .pr_body] | all(type == "string"))' "$RUNNER_TEMP/benny/outcome.json" > /dev/null
          echo "outcome=$(jq -r '.outcome' "$RUNNER_TEMP/benny/outcome.json")" >> "$GITHUB_OUTPUT"
      - name: Open the draft pull request
        if: steps.outcome.outputs.outcome == 'pr'
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          dir="$RUNNER_TEMP/benny"
          blocked() { printf '%s\n' "$1" > "$dir/blocked.txt"; echo "::error::$1"; exit 1; }
          git add -A
          changed=$(git diff --cached --name-only)
          [[ -n "$changed" ]] || blocked 'Claude reported a fix but changed no files.'
          forbidden=$(grep -E '^(infra|\.github|scripts/cloud|local-lab/migrations)/|(^|/)\.env|\.(tfvars|tfstate|pem|key)$' <<< "$changed" || true)
          [[ -z "$forbidden" ]] || blocked "The fix changes files Benny may not touch: $(paste -sd ' ' - <<< "$forbidden")."

          subject=$(jq -r '.commit_message' "$dir/outcome.json")
          grep -qE '^(fix|test|docs|content)(\([a-z0-9-]+\))?: .{1,60}$' <<< "$subject" || subject="fix: address WhatsApp report #$ISSUE"
          title=$(jq -r '.pr_title | gsub("\\s+"; " ") | .[0:100]' "$dir/outcome.json")
          [[ -n "${title// }" ]] || title="$subject"
          jq -r --arg issue "$ISSUE" --arg run "$RUN_URL" \
            '(.pr_body | gsub("@"; "@​")), "", "Fixes #\($issue)", "", "Drafted by the [Benny workflow](\($run))."' \
            "$dir/outcome.json" > "$dir/pr.md"

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "$subject"
          # This workflow owns the branch, and an open pull request on it stops the run before Claude starts.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          url=$(gh pr create --draft --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$dir/pr.md")
          # A pull request opened with GITHUB_TOKEN starts no pull_request workflow, so start CI directly.
          gh workflow run ci.yml --ref "$BRANCH"

          jq -r --arg url "$url" '"<!-- benny:pr -->", "Draft fix: \($url)", "", .reason | gsub("@"; "@​")' \
            "$dir/outcome.json" | gh issue comment "$ISSUE" --body-file -
          gh issue edit "$ISSUE" --remove-label benny:fixing --add-label benny:pr
      - name: Report why the fix stopped
        if: steps.outcome.outputs.outcome == 'blocked'
        run: |
          jq -r '"<!-- benny:blocked -->", "Benny stopped without a fix.", "", .reason | gsub("@"; "@​")' \
            "$RUNNER_TEMP/benny/outcome.json" | gh issue comment "$ISSUE" --body-file -
          gh issue edit "$ISSUE" --remove-label benny:fixing --add-label benny:blocked
      - name: Mark the report as blocked
        if: failure() || cancelled()
        run: |
          reason='The fix run failed or timed out.'
          if [[ -s "$RUNNER_TEMP/benny/blocked.txt" ]]; then reason=$(cat "$RUNNER_TEMP/benny/blocked.txt"); fi
          gh issue edit "$ISSUE" --remove-label benny:fixing --add-label benny:blocked
          printf '<!-- benny:blocked -->\nBenny stopped without a fix, so this needs a person. %s See the [workflow run](%s).\n' "$reason" "$RUN_URL" |
            gh issue comment "$ISSUE" --body-file -
