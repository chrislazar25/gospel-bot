name: Benny

# Triages WhatsApp reports that the bridge files as issues, and drafts a fix for a bug.
# The bridge mirrors the benny:* labels back to WhatsApp, so every path ends on a label.
# Label changes made here with GITHUB_TOKEN start no workflow, so both stages live in this file.
#
# Claude reads a public report and can run code, so the jobs that run Claude get a read-only
# token. The jobs that write labels, comments, branches and pull requests never run Claude, and
# they validate what Claude returned before acting on it.

on:
  issues:
    types: [opened, labeled]

permissions: {}

jobs:
  start:
    # The repository is public. Only the owner's account files reports and asks for a re-triage.
    if: >-
      github.event.issue.user.login == 'chrislazar25' &&
      github.event.sender.login == 'chrislazar25' &&
      contains(github.event.issue.labels.*.name, 'benny:report') &&
      (github.event.action == 'opened' || github.event.label.name == 'benny:triage-again')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Mark the report as in triage
        run: |
          for label in benny:triage benny:bug benny:other benny:no-repro benny:fixing benny:pr benny:blocked benny:triage-again; do
            gh label create "$label" --color 5319E7 --description 'Benny WhatsApp report state' 2>/dev/null || true
          done
          gh issue edit "$ISSUE" \
            --remove-label benny:triage-again,benny:bug,benny:other,benny:no-repro,benny:fixing,benny:blocked \
            --add-label benny:triage
      - name: Mark the report as blocked
        if: failure() || cancelled()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --remove-label benny:triage --add-label benny:blocked
          printf '<!-- benny:blocked -->\nBenny could not start triaging this report, so it needs a person. See the [workflow run](%s).\n' "$RUN_URL" |
            gh issue comment "$ISSUE" --body-file -

  triage:
    needs: start
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/benny/context.sh "$ISSUE" "$RUNNER_TEMP/benny"
      - name: Install OpenCode
        run: bash .github/benny/install-opencode.sh
      - name: Triage
        timeout-minutes: 25
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash .github/benny/run-opencode.sh triage
      - name: Hand over the verdict
        id: verdict
        run: |
          bash .github/benny/scan-secrets.sh "$RUNNER_TEMP/benny/triage-result.json"
          echo "verdict=$(base64 < "$RUNNER_TEMP/benny/triage-result.json" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  record:
    needs: [start, triage]
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      fix: ${{ steps.start.outputs.fix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/benny
      - name: Read the verdict
        id: verdict
        if: needs.triage.result == 'success'
        env:
          VERDICT_B64: ${{ needs.triage.outputs.verdict }}
        run: |
          dir="$RUNNER_TEMP/benny"
          mkdir -p "$dir"
          printf '%s' "$VERDICT_B64" | base64 -d > "$dir/verdict.json"
          jq -e '(.verdict | IN("bug", "other", "no-repro")) and (.summary | type == "string" and length > 0)
            and (.duplicate_of | type == "number" and . >= 0 and . == floor) and (.evidence | type == "string")' \
            "$dir/verdict.json" > /dev/null
          duplicate_of=$(jq -r '.duplicate_of' "$dir/verdict.json")
          if [[ "$duplicate_of" != 0 ]] && ! gh api "repos/$GITHUB_REPOSITORY/issues/$duplicate_of" |
            jq -e --argjson self "$ISSUE" '.state == "open" and .pull_request == null and .number != $self
              and .user.login == "chrislazar25" and any(.labels[]; .name == "benny:report")' > /dev/null; then
            echo "::warning::#$duplicate_of is not another open report, so this report is not treated as a duplicate."
            duplicate_of=0
          fi
          echo "verdict=$(jq -r '.verdict' "$dir/verdict.json")" >> "$GITHUB_OUTPUT"
          echo "duplicate_of=$duplicate_of" >> "$GITHUB_OUTPUT"
      - name: Post the verdict
        if: steps.verdict.outputs.verdict != ''
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          jq -r '"<!-- benny:triage -->", "**Triage: \(.verdict)**", "", .summary, "",
            "<details><summary>What Benny checked</summary>", "", .evidence, "", "</details>"
            | gsub("@"; "@​")' "$RUNNER_TEMP/benny/verdict.json" | gh issue comment "$ISSUE" --body-file -
          gh issue edit "$ISSUE" --remove-label benny:triage --add-label "benny:$VERDICT"
      - name: Start the fix
        id: start
        if: steps.verdict.outputs.verdict == 'bug' && steps.verdict.outputs.duplicate_of == '0'
        run: |
          existing=$(.github/benny/existing-fix.sh "$ISSUE")
          [[ -z "$existing" ]] || exit 0
          gh issue edit "$ISSUE" --add-label benny:fixing
          echo "fix=true" >> "$GITHUB_OUTPUT"
      - name: Mark the report as blocked
        if: failure() || cancelled() || needs.triage.result != 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --remove-label benny:triage,benny:fixing --add-label benny:blocked
          printf '<!-- benny:blocked -->\nBenny could not finish triaging this report, so it needs a person. See the [workflow run](%s).\n' "$RUN_URL" |
            gh issue comment "$ISSUE" --body-file -

  fix:
    needs: record
    if: needs.record.outputs.fix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      outcome: ${{ steps.package.outputs.outcome }}
      patch: ${{ steps.package.outputs.patch }}
      withheld: ${{ steps.package.outputs.withheld }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: Verification runs proposed code in this job, and a saved cache would carry it to other workflows.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare the fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -c "benny/issue-$ISSUE"
          .github/benny/context.sh "$ISSUE" "$RUNNER_TEMP/benny" fix
          npm ci --prefix local-lab
      - name: Install OpenCode
        run: bash .github/benny/install-opencode.sh
      - name: Fix
        timeout-minutes: 75
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: bash .github/benny/run-opencode.sh fix
      - name: Verify the proposed fix
        run: bash .github/benny/verify-fix.sh
      # An artifact on a public repository is downloadable by anyone, so the fix travels as job outputs.
      # A consuming step prints its env in the public log, so the patch leaves only after a secret scan.
      - name: Package the fix
        id: package
        run: |
          dir="$RUNNER_TEMP/benny-fix"
          mkdir -p "$dir"
          # Run the scanner from the original workflow commit.
          git show "$GITHUB_SHA:.github/benny/scan-secrets.sh" > "$dir/scan-secrets.sh"
          bash "$dir/scan-secrets.sh" "$RUNNER_TEMP/benny/fix-result.json"
          git add -A
          git diff --cached --binary > "$dir/fix.patch"
          # The publish job reads the patch from one environment variable, and Linux caps one string at 128 KiB.
          # A 64 KiB patch is about 86 KiB after Base64, so it stays well under that and under the 1 MB job output limit.
          if [[ ! -s "$dir/fix.patch" ]]; then
            echo 'withheld=OpenCode reported a fix but changed no files.' >> "$GITHUB_OUTPUT"
          elif (( $(wc -c < "$dir/fix.patch") > 65536 )); then
            echo 'withheld=The fix is larger than 64 KB, which is too big for a focused draft.' >> "$GITHUB_OUTPUT"
          elif ! bash "$dir/scan-secrets.sh"; then
            echo 'withheld=The fix looks like it contains a secret, so Benny did not hand it on.' >> "$GITHUB_OUTPUT"
          else
            echo "patch=$(base64 < "$dir/fix.patch" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          fi
          echo "outcome=$(base64 < "$RUNNER_TEMP/benny/fix-result.json" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  publish:
    needs: [record, fix]
    if: always() && needs.record.outputs.fix == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: benny-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      # A new branch per attempt, so a push never needs to overwrite one.
      BRANCH: benny/issue-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.fix.result == 'success'
        with:
          fetch-depth: 0
      - name: Read the outcome
        id: outcome
        if: needs.fix.result == 'success'
        env:
          OUTCOME_B64: ${{ needs.fix.outputs.outcome }}
        run: |
          dir="$RUNNER_TEMP/benny"
          mkdir -p "$dir"
          blocked() { printf '%s\n' "$1" > "$dir/blocked.txt"; echo "::error::$1"; exit 1; }
          # GitHub drops a job output that may contain a secret, so an empty one never arrived.
          [[ -n "$OUTCOME_B64" ]] || blocked "Benny's outcome did not reach this job. GitHub withholds a job output that may contain a secret."
          printf '%s' "$OUTCOME_B64" | base64 -d > "$dir/outcome.json"
          jq -e '(.outcome | IN("pr", "blocked")) and (.reason | type == "string" and length > 0)
            and ([.commit_message, .pr_title, .pr_body] | all(type == "string"))' "$dir/outcome.json" > /dev/null
          jq -r '.. | strings' "$dir/outcome.json" > "$dir/outcome.txt"
          .github/benny/scan-secrets.sh "$dir/outcome.txt" ||
            blocked "Benny's outcome looks like it contains a secret, so Benny did not publish it."
          echo "outcome=$(jq -r '.outcome' "$dir/outcome.json")" >> "$GITHUB_OUTPUT"
      - name: Open the draft pull request
        if: steps.outcome.outputs.outcome == 'pr'
        env:
          BASE: ${{ github.event.repository.default_branch }}
          PATCH_B64: ${{ needs.fix.outputs.patch }}
          WITHHELD: ${{ needs.fix.outputs.withheld }}
        run: |
          dir="$RUNNER_TEMP/benny"
          blocked() { printf '%s\n' "$1" > "$dir/blocked.txt"; echo "::error::$1"; exit 1; }
          [[ -z "$WITHHELD" ]] || blocked "$WITHHELD"
          [[ -n "$PATCH_B64" ]] || blocked 'The fix did not reach this job. GitHub withholds a job output that may contain a secret.'
          printf '%s' "$PATCH_B64" | base64 -d > "$dir/fix.patch"
          git apply --index "$dir/fix.patch" || blocked 'The fix does not apply to the commit it was made on.'
          protected='^(infra|\.github|\.opencode|scripts/cloud|local-lab/migrations)/|(^|/)\.env|\.(tfvars|tfstate|pem|key)$'
          changed=() forbidden=()
          # Git quotes an unusual name unless -z is given, and a quoted name would slip past the pattern.
          # Without rename detection, a moved file lists both its old and its new path.
          while IFS= read -r -d '' path; do
            changed+=("$path")
            if [[ "$path" =~ $protected ]]; then forbidden+=("$path"); fi
          done < <(git diff --cached --name-only -z --no-renames)
          (( ${#changed[@]} )) || blocked 'OpenCode reported a fix but changed no files.'
          (( ! ${#forbidden[@]} )) || blocked "The fix changes files Benny may not touch: ${forbidden[*]}."
          # The check above refuses a change to .github/, so this scan is the one on the base commit.
          .github/benny/scan-secrets.sh || blocked 'The fix looks like it contains a secret, so Benny did not publish it.'

          subject=$(jq -r '.commit_message' "$dir/outcome.json")
          grep -qE '^(fix|test|docs|content)(\([a-z0-9-]+\))?: .{1,60}$' <<< "$subject" || subject="fix: address WhatsApp report #$ISSUE"
          title=$(jq -r '.pr_title | gsub("\\s+"; " ") | .[0:100]' "$dir/outcome.json")
          [[ -n "${title// }" ]] || title="$subject"
          jq -r --arg issue "$ISSUE" --arg run "$RUN_URL" \
            '(.pr_body | gsub("@"; "@​")), "", "Fixes #\($issue)", "", "Drafted by the [Benny workflow](\($run))."' \
            "$dir/outcome.json" > "$dir/pr.md"

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "$subject"
          # A rerun of this job alone, or an overlapping run, may have opened a draft since record checked.
          # Every Benny job for this issue shares one concurrency group, so no other run opens one after this check.
          existing=$(.github/benny/existing-fix.sh "$ISSUE")
          [[ -z "$existing" ]] || exit 0
          git push origin "HEAD:refs/heads/$BRANCH"
          if ! url=$(gh pr create --draft --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$dir/pr.md"); then
            # A rerun pushes a different branch, so this one would stay public with no draft. If the request
            # failed after GitHub created the draft, the branch belongs to it, and a rerun picks that draft up.
            if [[ "$(gh pr list --state all --head "$BRANCH" --limit 1000 --json isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)] | length')" == 0 ]]; then
              if git push origin --delete "$BRANCH"; then
                echo "::notice::Deleted $BRANCH because its draft pull request could not be created."
              else
                echo "::warning::Could not delete $BRANCH after its draft pull request failed. Delete it by hand."
              fi
            fi
            blocked 'Benny pushed a branch but could not open the draft pull request.'
          fi
          # A pull request opened with GITHUB_TOKEN starts no pull_request workflow, so start CI directly.
          gh workflow run ci.yml --ref "$BRANCH"

          jq -r --arg url "$url" '"<!-- benny:pr -->", "Draft fix: \($url)", "", .reason | gsub("@"; "@​")' \
            "$dir/outcome.json" | gh issue comment "$ISSUE" --body-file -
          gh issue edit "$ISSUE" --remove-label benny:fixing --add-label benny:pr
      - name: Report why the fix stopped
        if: steps.outcome.outputs.outcome == 'blocked'
        run: |
          jq -r '"<!-- benny:blocked -->", "Benny stopped without a fix.", "", .reason | gsub("@"; "@​")' \
            "$RUNNER_TEMP/benny/outcome.json" | gh issue comment "$ISSUE" --body-file -
          gh issue edit "$ISSUE" --remove-label benny:fixing --add-label benny:blocked
      - name: Mark the report as blocked
        if: failure() || cancelled() || needs.fix.result != 'success'
        run: |
          reason='The fix run failed or timed out.'
          if [[ -s "$RUNNER_TEMP/benny/blocked.txt" ]]; then reason=$(cat "$RUNNER_TEMP/benny/blocked.txt"); fi
          gh issue edit "$ISSUE" --remove-label benny:fixing --add-label benny:blocked
          printf '<!-- benny:blocked -->\nBenny stopped without a fix, so this needs a person. %s See the [workflow run](%s).\n' "$reason" "$RUN_URL" |
            gh issue comment "$ISSUE" --body-file -
