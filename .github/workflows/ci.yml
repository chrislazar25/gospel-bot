name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-lab:
    name: Delivery lab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local-lab/package-lock.json
      - run: npm ci
        working-directory: local-lab
      - run: node --test scripts/cloud/neon-operation.test.mjs
      - run: npm run check
        working-directory: local-lab
      - run: node --test local-lab/whiteboard-cdp.test.mjs local-lab/whiteboard-startup.test.mjs
      - run: node local-lab/verify.mjs all
      - run: node local-lab/verify-lifecycle.mjs
      - name: Preserve local simulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-lab-evidence
          path: local-lab/evidence/
          retention-days: 7
  production-runtime:
    name: Production runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node local-lab/verify-runtime.mjs
      - run: node local-lab/verify-image.mjs
      - name: Preserve runtime verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence
          path: local-lab/evidence/
          retention-days: 7
  cloud-smoke:
    name: Isolated cloud smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/cloud/cloud-smoke.test.mjs
      - run: scripts/cloud/cloud-smoke.sh local
      - name: Preserve isolated smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-smoke-local-evidence
          path: cloud-smoke-evidence/
          retention-days: 7
