name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-lab:
    name: Delivery lab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local-lab/package-lock.json
      - run: npm ci
        working-directory: local-lab
      - run: npm run check
        working-directory: local-lab
      - run: node --test local-lab/whiteboard-cdp.test.mjs
      - run: node local-lab/verify.mjs all
      - run: node local-lab/verify-lifecycle.mjs
      - name: Preserve local simulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-lab-evidence
          path: local-lab/evidence/
          retention-days: 7
  production-runtime:
    name: Production runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node local-lab/verify-runtime.mjs
      - run: docker build -f local-lab/Dockerfile.runtime -t gospel-runtime:ci .
      - name: Verify packaged runtime excludes simulator entry points
        run: |
          docker run --rm --entrypoint sh gospel-runtime:ci -ec '
            test "$(id -u)" = 1000
            test -f dist/runtime.js
            test -f content/schedule.json
            test -f migrations/001_initial.sql
            test ! -e dist/fake.js
            test ! -e dist/core.js
            test ! -e dist/app.js
            test ! -e dist/http.js
          '
      - name: Preserve runtime verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence
          path: local-lab/evidence/
          retention-days: 7
