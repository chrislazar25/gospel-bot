name: Infrastructure
on:
  pull_request:
    paths: ['infra/**', 'scripts/cloud/**', '.github/workflows/infrastructure.yml', '.github/workflows/release.yml', '.github/workflows/neon.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      operation:
        type: choice
        options: [plan, secrets, apply, smoke-plan, smoke-apply, canary-plan, canary-apply]
        default: plan
        required: true
permissions:
  contents: read
concurrency:
  group: cloud-${{ inputs.environment || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
      - run: terraform fmt -check -recursive infra
      - run: |
          for dir in infra/bootstrap infra/environment infra/smoke infra/canary; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
      - run: terraform -chdir=infra/environment test
      - run: terraform -chdir=infra/canary test
      - run: node scripts/cloud/canary.test.mjs
      - run: for script in scripts/cloud/*.sh; do bash -n "$script"; done
      - run: for module in scripts/cloud/neon*.mjs; do node --check "$module"; done
      - run: node scripts/cloud/verify-workflows.mjs
  manage:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.operation != 'smoke-plan' && inputs.operation != 'smoke-apply' && inputs.operation != 'canary-plan' && inputs.operation != 'canary-apply'
    needs: validate
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_image: ${{ vars.INITIAL_IMAGE }}
      TF_VAR_green_api_url: ${{ vars.GREEN_API_URL }}
      TF_VAR_green_api_id: ${{ vars.GREEN_API_ID }}
      TF_VAR_target_chat_id: ${{ vars.TARGET_CHAT_ID }}
      TF_VAR_monitoring_enabled: ${{ vars.MONITORING_ENABLED || 'false' }}
      TF_VAR_secret_versions: ${{ vars.SECRET_VERSIONS_JSON }}
      TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}
      TF_VAR_status_invokers: ${{ vars.STATUS_INVOKERS_JSON }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: gospel-infra-${{ inputs.environment }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
      - run: terraform -chdir=infra/environment init -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=$TF_VAR_environment"
      - run: |
          options=()
          if [[ "$OPERATION" == secrets ]]; then
            unset TF_VAR_image TF_VAR_green_api_url TF_VAR_green_api_id TF_VAR_target_chat_id
            unset TF_VAR_monitoring_enabled TF_VAR_secret_versions TF_VAR_notification_email TF_VAR_status_invokers
            options=(-target=google_secret_manager_secret.secret -target=google_secret_manager_secret_iam_member.neon_write -target=google_secret_manager_secret_iam_member.neon_read)
          fi
          terraform -chdir=infra/environment plan "${options[@]}" -out=deployment.plan
          if [[ "$OPERATION" != plan ]]; then
            terraform -chdir=infra/environment apply deployment.plan
          fi
  smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && (inputs.operation == 'smoke-plan' || inputs.operation == 'smoke-apply')
    needs: validate
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_image: ${{ vars.SMOKE_IMAGE }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require staging for smoke infrastructure
        if: inputs.environment != 'staging'
        run: exit 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: gospel-infra-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
      - run: terraform -chdir=infra/smoke init -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=staging/cloud-smoke"
      - run: |
          terraform -chdir=infra/smoke plan -out=deployment.plan
          if [[ "$OPERATION" == smoke-apply ]]; then
            terraform -chdir=infra/smoke apply deployment.plan
          fi
  canary:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && (inputs.operation == 'canary-plan' || inputs.operation == 'canary-apply')
    needs: validate
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_image: ${{ vars.CANARY_IMAGE }}
      TF_VAR_revision: ${{ vars.CANARY_REVISION }}
      TF_VAR_target_chat_id: ${{ vars.CANARY_TARGET_CHAT_ID }}
      TF_VAR_attempt: ${{ vars.CANARY_ATTEMPT }}
      TF_VAR_green_api_url: ${{ vars.GREEN_API_URL }}
      TF_VAR_green_api_id: ${{ vars.GREEN_API_ID }}
      TF_VAR_secret_versions: ${{ vars.SECRET_VERSIONS_JSON }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require staging for canary infrastructure
        if: inputs.environment != 'staging'
        run: exit 1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: gospel-infra-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
      - run: terraform -chdir=infra/canary init -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=staging/canary"
      - run: |
          terraform -chdir=infra/canary plan -out=deployment.plan
          if [[ "$OPERATION" == canary-apply ]]; then
            terraform -chdir=infra/canary apply deployment.plan
            gcloud run jobs execute gospel-staging-canary-migrate --wait --region="$TF_VAR_region" --project="$TF_VAR_project_id" --quiet
          fi
