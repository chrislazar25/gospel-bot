services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
      POSTGRES_DB: runtime
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U runtime -d runtime"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [test]
  verify:
    build:
      context: ../..
      dockerfile: local-lab/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgres://runtime:runtime@db:5432/runtime
    depends_on:
      db: {condition: service_healthy}
    networks: [test]
networks:
  test: {internal: true}
