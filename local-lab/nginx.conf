resolver 127.0.0.11 valid=1s ipv6=off;
server { listen 3001; set $upstream app1:3000; location / { proxy_pass http://$upstream; } }
server { listen 3002; set $upstream app2:3000; location / { proxy_pass http://$upstream; } }
server { listen 3003; set $upstream fake:3000; location / { proxy_pass http://$upstream; } }
